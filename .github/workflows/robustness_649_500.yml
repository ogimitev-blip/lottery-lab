name: Robustness 6/49 500

on:
  push:
    branches: [main]
    paths:
      - "scripts/robustness_649_500.py"
      - ".github/workflows/robustness_649_500.yml"
  workflow_dispatch:

jobs:
  robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/robustness_649_500.py
