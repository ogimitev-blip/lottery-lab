name: Research K22 FM Raw Attribution

on:
  push:
    branches: [main]
    paths:
      - "scripts/research_k22_fm_raw_attribution.py"
      - ".github/workflows/research_k22_fm_raw_attribution.yml"
      - "lottery/models.py"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/research_k22_fm_raw_attribution.py
