name: Sync official Toto draws

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * 4"
    - cron: "30 20 * * 0"
    - cron: "30 22 * * 4"
    - cron: "30 22 * * 0"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests beautifulsoup4
      - run: python scripts/sync_toto.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No new official draw found."
            exit 0
          fi
          git config user.name "lottery-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Sync official Toto draw results"
          git push
