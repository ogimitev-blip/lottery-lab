name: Manual BST parser probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests beautifulsoup4
      - name: Try direct BST fetch
        run: python scripts/sync_toto.py
      - name: Commit only if official data were actually retrieved
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No verified new official data retrieved."
            exit 0
          fi
          git config user.name "lottery-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Sync verified official Toto data"
          git push
