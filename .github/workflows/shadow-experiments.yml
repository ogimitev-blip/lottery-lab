name: Freeze Shadow Experiments

on:
  push:
    branches: [main]
    paths:
      - "data/draws_642.csv"
      - "data/draws_649.csv"
      - "scripts/generate_shadow_experiments.py"
      - ".github/workflows/shadow-experiments.yml"
      - "systems/k22_conversion_v5_rank_weights.json"
      - "lottery/conversion_v5.py"
      - "lottery/shadow.py"
      - "lottery/allocation_shadow.py"
      - "lottery/k22_score_shadow.py"
      - "lottery/k22_vnext.py"
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: freeze-shadow-experiments
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh main before freezing
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/generate_shadow_experiments.py
      - name: Commit newly frozen shadow rows
        run: |
          if [ -z "$(git status --porcelain -- data/shadow_experiments.jsonl data/allocation_shadows.jsonl data/k22_score_shadows.jsonl)" ]; then
            echo "No new future shadow batch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shadow_experiments.jsonl data/allocation_shadows.jsonl data/k22_score_shadows.jsonl
          git commit -m "Freeze prospective lottery shadow batch"
          git push
