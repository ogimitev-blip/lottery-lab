name: Backtest K22 Conversion V4

on:
  push:
    branches: [main]
    paths:
      - "scripts/backtest_k22_conversion_v4.py"
      - "systems/k22_conversion_v4_candidate.csv"
      - ".github/workflows/backtest_k22_conversion_v4.yml"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/backtest_k22_conversion_v4.py
