name: Generate 6/49 500 Draw 76

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_649_500_draw76.py"
      - ".github/workflows/generate_649_500_draw76.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/generate_649_500_draw76.py
      - name: Commit generated tickets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/649_500_draw76.csv data/649_500_draw76_manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Generate €500 draw 76 ticket set"
            git push
          fi
