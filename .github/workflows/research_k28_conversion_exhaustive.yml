name: Research K28 Conversion Exhaustive

on:
  push:
    branches: [main]
    paths:
      - "scripts/research_k28_conversion_exhaustive.py"
      - ".github/workflows/research_k28_conversion_exhaustive.yml"
      - "systems/k28_nested_130.csv"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/research_k28_conversion_exhaustive.py
